name: Validate Firebase Functions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SECRETS: ${{ secrets.GCP_SA_KEY != '' }}
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Run tests
        run: yarn test

      # Workflow runs triggered directly by Dependabot don't receive repository
      # secrets, so the dry-run steps below skip gracefully in that case instead
      # of failing on a missing credential.
      - name: Install Firebase CLI
        if: env.HAS_FIREBASE_SECRETS == 'true'
        run: npm install -g firebase-tools

      - name: Authenticate with Google Cloud
        if: env.HAS_FIREBASE_SECRETS == 'true'
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Create .env file
        if: env.HAS_FIREBASE_SECRETS == 'true'
        run: |
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" >> .env
          echo "NEWSDATAIO_API_KEY=${{ secrets.NEWSDATAIO_API_KEY }}" >> .env
          echo "SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY }}" >> .env
          echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" >> .env
          echo "CALENDARIFIC_API_KEY=${{ secrets.CALENDARIFIC_API_KEY }}" >> .env

      - name: Validate Firebase Functions
        if: env.HAS_FIREBASE_SECRETS == 'true'
        run: firebase deploy --dry-run --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}


