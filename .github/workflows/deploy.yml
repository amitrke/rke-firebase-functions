name: Deploy to Firebase

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Lint
        run: yarn lint
      - name: Build
        run: yarn build
      - name: Run tests
        run: yarn test

      # Workflow runs triggered directly by Dependabot don't receive repository
      # secrets, so the dry-run steps below skip gracefully in that case instead
      # of failing on a missing credential.
      - name: Install Firebase CLI
        if: github.event_name == 'pull_request' && secrets.GCP_SA_KEY != ''
        run: npm install -g firebase-tools

      - name: Authenticate with Google Cloud
        if: github.event_name == 'pull_request' && secrets.GCP_SA_KEY != ''
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Create .env file
        if: github.event_name == 'pull_request' && secrets.GCP_SA_KEY != ''
        run: |
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" >> .env
          echo "NEWSDATAIO_API_KEY=${{ secrets.NEWSDATAIO_API_KEY }}" >> .env
          echo "SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY }}" >> .env
          echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" >> .env
          echo "CALENDARIFIC_API_KEY=${{ secrets.CALENDARIFIC_API_KEY }}" >> .env

      - name: Validate Firebase Functions (dry run)
        if: github.event_name == 'pull_request' && secrets.GCP_SA_KEY != ''
        run: firebase deploy --dry-run --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}

  deploy:
    if: github.event_name == 'push'
    needs: build_and_test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build
        run: yarn build
      - name: Authenticate with Google Cloud
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Create .env file
        run: |
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" >> .env
          echo "NEWSDATAIO_API_KEY=${{ secrets.NEWSDATAIO_API_KEY }}" >> .env
          echo "SERPAPI_API_KEY=${{ secrets.SERPAPI_API_KEY }}" >> .env
          echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" >> .env
          echo "CALENDARIFIC_API_KEY=${{ secrets.CALENDARIFIC_API_KEY }}" >> .env
      - name: Deploy to Firebase
        run: firebase deploy --only functions --project ${{ secrets.FIREBASE_PROJECT_ID }}
